services:
  - type: web
    name: precious-moments
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:shop
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_DEMO
        value: 'false'
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: TRUST_PROXY
        value: '1'
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: ZAI_API_BASE
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_MODEL
        value: glm-5.3-flash
