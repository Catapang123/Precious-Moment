<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Tarpaulin product reference</title>
  <desc id="desc">A printed tarpaulin banner with metal grommets and a subtle floral print.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f3"/>
      <stop offset="1" stop-color="#ffe1ea"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d9e3"/>
      <stop offset=".5" stop-color="#fff7f3"/>
      <stop offset="1" stop-color="#f3bfd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#351b27" flood-opacity=".18"/>
    </filter>
    <g id="grommet">
      <circle r="17" fill="#e9c477" stroke="#8f6828" stroke-width="4"/>
      <circle r="8" fill="#351b27" opacity=".6"/>
    </g>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="190" fill="#fffdfb" opacity=".55"/>
  <circle cx="120" cy="800" r="240" fill="#fffdfb" opacity=".42"/>
  <g transform="translate(150 160) rotate(-2 450 290)" filter="url(#shadow)">
    <rect x="0" y="0" width="900" height="570" rx="8" fill="url(#fabric)" stroke="#c72b5c" stroke-opacity=".3" stroke-width="3"/>
    <path d="M0 70h900M0 500h900" stroke="#c72b5c" stroke-opacity=".22" stroke-width="2" stroke-dasharray="8 10"/>
    <use href="#grommet" x="35" y="35"/>
    <use href="#grommet" x="865" y="35"/>
    <use href="#grommet" x="35" y="535"/>
    <use href="#grommet" x="865" y="535"/>
    <use href="#grommet" x="450" y="35"/>
    <use href="#grommet" x="450" y="535"/>
    <g opacity=".88">
      <text x="450" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="42" letter-spacing="8" fill="#991943">PRECIOUS MOMENTS</text>
      <text x="450" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="84" fill="#351b27">Every moment,</text>
      <text x="450" y="382" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="92" fill="#c72b5c">kept.</text>
      <path d="M300 425c80-35 220-35 300 0" fill="none" stroke="#c6953c" stroke-width="2" stroke-linecap="round"/>
      <circle cx="255" cy="415" r="7" fill="#c6953c"/>
      <circle cx="645" cy="415" r="7" fill="#c6953c"/>
    </g>
  </g>
  <g transform="translate(1000 780)">
    <rect x="-180" y="-38" width="360" height="66" rx="33" fill="#fffdfb" stroke="#351b27" stroke-opacity=".14"/>
    <text x="0" y="5" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="17" letter-spacing="3" fill="#725863">PRODUCT REFERENCE · TARPAULIN</text>
  </g>
</svg>
