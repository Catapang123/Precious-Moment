<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio dashboard — Precious Moments</title>
    <meta name="description" content="Precious Moments customer, staff, and studio dashboard." />
    <meta name="theme-color" content="#fff7f3" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/app.js" type="module"></script>
  </head>
  <body class="app-body">
    <a class="skip-link" href="#view">Skip to dashboard</a>

    <aside class="sidebar" id="sidebar" aria-label="Studio navigation">
      <button class="icon-button sidebar-close" type="button" data-close-sidebar aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
      <a class="brand" href="/app" aria-label="Precious Moments dashboard">
        <span class="brand-seal" aria-hidden="true">PM</span>
        <span class="brand-words">
          <span class="brand-name">Precious Moments</span>
          <span class="brand-sub">studio dashboard</span>
        </span>
      </a>
      <p class="sidebar-role" data-role-label>Studio</p>
      <nav class="sidebar-nav" data-sidebar-nav aria-label="Dashboard"></nav>
      <div class="sidebar-bottom">
        <a class="sidebar-link" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9" /><path d="M18 13v6H5V6h6" /></svg>
          View the public site
        </a>
        <div class="user-chip" data-user-chip></div>
      </div>
    </aside>
    <div class="sidebar-backdrop" data-close-sidebar></div>

    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="icon-button menu-toggle" type="button" data-open-sidebar aria-label="Open menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div>
            <h1 data-page-title>Overview</h1>
            <p data-page-subtitle>Loading your studio...</p>
          </div>
        </div>
        <div class="topbar-right">
          <span class="topbar-date" data-today></span>
          <span class="topbar-avatar" data-avatar aria-hidden="true">PM</span>
        </div>
      </header>
      <main class="app-view" id="view">
        <div class="load-screen"><span class="spinner" aria-hidden="true"></span> Opening your dashboard...</div>
      </main>
    </div>

    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
