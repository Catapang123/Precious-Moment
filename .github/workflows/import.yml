name: Import project

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Public source tarball
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source bundle
        run: curl -fsSL "${{ inputs.source_url }}" -o /tmp/source.tar.gz
      - name: Extract and commit
        run: |
          tar -xzf /tmp/source.tar.gz
          rm -f .github/workflows/import.yml
          git config user.name "Precious Moments"
          git config user.email "dev@preciousmoments.ph"
          git add -A
          git commit -m "Import Precious Moments application" || true
          git push
